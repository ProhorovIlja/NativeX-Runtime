name: Scarlett compatibility research CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-source-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Offline Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline GitHub revision fixture
        run: python tools/radar.py --offline-fixture tests/fixtures/public_metadata.json --report artifacts/radar.md --snapshot artifacts/radar.json
      - name: Offline project discovery fixture
        run: python tools/discover.py --offline-fixture tests/fixtures/discovery.json --report artifacts/discovery.md --snapshot artifacts/discovery.json
      - name: Offline upstream commit subject fixture
        run: python tools/commit_watch.py --offline-fixture tests/fixtures/commit_watch.json --report artifacts/commit-leads.md
      - name: Compile original read-only PE parser
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure

  windows-x64-source-fixtures:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Discover Windows SDK DXC (optional, no downloads)
        shell: pwsh
        run: |
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $found = @(Get-ChildItem -LiteralPath $kits -Filter dxc.exe -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\dxc\.exe
        run: cmake -S . -B build -A x64
      - name: Compile C++17 native programs
        run: cmake --build build --config Release
      - name: Run synthetic PE32+ and host fixture tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Print Windows host prerequisites (not game compatibility)
        run: .\build\Release\win_native_probe.exe
 } |
            Sort-Object FullName -Descending)
          if ($found.Count -gt 0) {
            "SCARLETT_DXC_PATH=$($found[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Windows SDK DXC found"
          } else {
            Write-Host "No installed DXC; optional SM6 wave test omitted"
          }
      - name: Configure MSVC x64
        run: cmake -S . -B build -A x64
      - name: Compile C++17 native programs
        run: cmake --build build --config Release
      - name: Run synthetic PE32+ and host fixture tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Print Windows host prerequisites (not game compatibility)
        run: .\build\Release\win_native_probe.exe
