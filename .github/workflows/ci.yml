name: Scarlett compatibility research CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-source-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Offline Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline GitHub revision fixture
        run: python tools/radar.py --offline-fixture tests/fixtures/public_metadata.json --report artifacts/radar.md --snapshot artifacts/radar.json
      - name: Offline project discovery fixture
        run: python tools/discover.py --offline-fixture tests/fixtures/discovery.json --report artifacts/discovery.md --snapshot artifacts/discovery.json
      - name: Offline upstream commit subject fixture
        run: python tools/commit_watch.py --offline-fixture tests/fixtures/commit_watch.json --report artifacts/commit-leads.md
      - name: Offline PC SDK release radar fixture
        run: python tools/sdk_radar.py --offline-fixture tests/fixtures/sdk_release_metadata.json --report artifacts/sdk-releases.md --snapshot artifacts/sdk-releases.json
      - name: Compile original read-only PE parser
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure

  windows-x64-source-fixtures:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Discover installed Windows SDK DXC (optional SM6 test)
        shell: pwsh
        run: |
          $root = 'C:\Program Files (x86)\Windows Kits\10\bin'
          $items = @(Get-ChildItem -LiteralPath $root -Filter dxc.exe -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName -Descending)
          if ($items.Count -gt 0) {
            $path = $items[0].FullName
            Add-Content -Path $env:GITHUB_ENV -Value "SCARLETT_DXC_PATH=$path"
            Write-Host 'Installed Windows SDK DXC found'
          } else {
            Write-Host 'No SDK DXC: optional SM6 test will not be registered'
          }
      - name: Configure MSVC x64
        run: cmake -S . -B build -A x64
      - name: Compile C++17 native programs
        run: cmake --build build --config Release
      - name: Run synthetic PE32+ and host fixture tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Record SM6 adapter IDs and hardware test disposition
        run: ctest --test-dir build -C Release -R d3d12_sm6_hardware_wave_differential -V
      - name: Print Windows host prerequisites (not game compatibility)
        run: .\build\Release\win_native_probe.exe
