name: Public source metadata radar

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Read public upstream branch SHAs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/radar.py --report artifacts/revisions.md --snapshot artifacts/revisions.json
      - name: Discover new repositories and forks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/discover.py --report artifacts/candidates.md --snapshot artifacts/candidates.json
      - name: Retain small metadata reports (no game files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-source-metadata
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
